[project]
name = "orion"
version = "0.1.0"
description = "Orion — Voice-first AI agent with OpenClaw execution backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx>=0.27",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "livekit-plugins-elevenlabs>=0.2.1",
    "python-dotenv",
    "websockets",
]

[project.scripts]
orion_server = "server:main"
orion_voice = "agent:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion", "bridge", "server.py", "agent.py"]
