[project]
name = "orion"
version = "0.1.0"
description = "Orion — Voice-first AI agent with OpenClaw execution backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "fastapi>=0.115",
    "httpx>=0.27",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "livekit-plugins-elevenlabs>=0.2.1",
    "pydantic>=2.8",
    "python-dotenv",
    "sqlmodel>=0.0.19",
    "aiosqlite>=0.19.0",
    "uvicorn>=0.30",
    "websockets",
]

[project.scripts]
orion_server = "server:main"
orion_voice = "agent:dev"
orion_api = "orion.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion", "bridge", "server.py", "agent.py"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
