[project]
name = "orion"
version = "0.1.0"
description = "Orion — Voice-first AI agent with OpenClaw execution backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "fastapi>=0.115",
    "httpx>=0.27",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "livekit-plugins-elevenlabs>=0.2.1",
    "pydantic>=2.8",
    "python-dotenv",
    "sqlmodel>=0.0.19",
    "aiosqlite>=0.19.0",
    "uvicorn>=0.30",
    "websockets",
    "apscheduler>=3.10.0",
    "anthropic>=0.122.0",
    "livekit-plugins-anthropic>=1.6",
    "json5>=0.17.3",
]

[project.scripts]
orion = "orion.cli:main"
orion_voice = "agent:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"

# apscheduler ships no type stubs or py.typed marker.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["orion", "bridge", "agent.py"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
